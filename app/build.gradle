plugins { id 'com.android.application' }
android {
    namespace 'ua.abonclient.app'
    compileSdk 35
    defaultConfig {
        applicationId 'ua.abonclient.app'
        minSdk 23
        targetSdk 35
        versionCode (System.getenv('GITHUB_RUN_NUMBER') ?: '2').toInteger() + 100
        versionName '1.1'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
