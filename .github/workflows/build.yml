name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: abon-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build unsigned APK
        run: gradle --no-daemon assembleRelease
      - name: Sign APK
        env:
          KEY_B64: ${{ secrets.MALINFOREST_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.MALINFOREST_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MALINFOREST_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.MALINFOREST_KEY_PASSWORD }}
        run: |
          set -eu
          test -n "$KEY_B64" && test -n "$STORE_PASS" && test -n "$KEY_ALIAS" && test -n "$KEY_PASS"
          umask 077
          KEYFILE="$RUNNER_TEMP/abon-signing.jks"
          trap 'rm -f "$KEYFILE"' EXIT
          printf '%s' "$KEY_B64" | base64 --decode > "$KEYFILE"
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$TOOLS/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$TOOLS/apksigner" sign --ks "$KEYFILE" --ks-key-alias "$KEY_ALIAS" --ks-pass env:STORE_PASS --key-pass env:KEY_PASS --out AbonClient.apk "$RUNNER_TEMP/aligned.apk"
          "$TOOLS/apksigner" verify AbonClient.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AbonClient
          path: AbonClient.apk
          if-no-files-found: error
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CODE=$((GITHUB_RUN_NUMBER + 100))
          VERSION=$(sed -n "s/.*versionName *= *'\([^']*\)'.*/\1/p" app/build.gradle)
          test -n "$VERSION"
          TAG="v$VERSION-$CODE"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" AbonClient.apk --clobber
          else
            gh release create "$TAG" AbonClient.apk --target "$GITHUB_SHA" --title "AbonClient $VERSION (збірка $CODE)" --generate-notes --latest
          fi
